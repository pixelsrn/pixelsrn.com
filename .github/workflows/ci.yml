name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch instead of burning Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
