name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Show formatting diff
        if: failure()
        run: |
          npx prettier --write . >/dev/null 2>&1 || true
          git --no-pager diff --stat
          git --no-pager diff | head -100

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
