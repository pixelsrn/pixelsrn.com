version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps instead of a dozen.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors land ahead of Astro's tooling support. Re-check
      # when @astrojs/check declares compatibility, then remove this.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
